server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # 后端单文件上限为 200MB；为 multipart 边界和请求头预留余量，
        # 同时让大文件直接流向后端，避免 Nginx 先完整落盘再转发。
        client_max_body_size 210m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # API-Hub 的 Streamable HTTP MCP 端点不在 /api 下；关闭缓冲以免
    # 长连接响应被 Nginx 攒住，同时保留管理 API 走上面的 /api 代理。
    location /api-hub/ {
        proxy_pass http://backend:8000/api-hub/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The platform MinIO MCP is independent from the retired generic /mcp
    # endpoint. Keep its public URL routable while making the retired endpoint
    # fail explicitly instead of falling through to the SPA index page.
    location ^~ /mcp/minio {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        return 404;
    }

    location /mcp/ {
        return 404;
    }

    # 普通调用方使用的接口转发入口。公开请求不经过平台 JWT，
    # 每次调用由后端使用接口专属调用凭证鉴权。
    location /proxy/ {
        proxy_pass http://backend:8000/proxy/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 入口页必须每次回源校验（有 ETag，未变时 304 很便宜）——
        # 否则浏览器启发式缓存旧 index.html，引用已被替换的旧 bundle，
        # 部署后用户持续看到旧版界面
        add_header Cache-Control "no-cache";
    }
}
