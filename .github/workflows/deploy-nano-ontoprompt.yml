name: Deploy nano-ontoprompt
on:
  push:
    branches: [nano-ontoprompt]
  workflow_dispatch:
concurrency:
  group: deploy-nano-ontoprompt
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # 首次安装 Python/Node 依赖 + 800+ 后端用例 + 迁移检查 + 前端生产构建
    # 在冷缓存 runner 上可能超过 25 分钟；保留明确上限，避免误取消正常验证。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Backend regression suite
        run: pytest -q --disable-warnings
        working-directory: backend

      - name: Fresh database migration
        run: |
          DB_FILE="$(mktemp -u /tmp/ontologybuild-ci-XXXXXX.db)"
          DATABASE_URL="sqlite:///${DB_FILE}" alembic upgrade head
          test "$(alembic heads | grep -c '(head)')" -eq 1
          rm -f "${DB_FILE}"
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend production build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Ontology evolution browser regression
        working-directory: frontend
        env:
          PLAYWRIGHT_API_URL: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: |
          E2E_DB=/tmp/ontologybuild-evolution-e2e.db
          rm -f "${E2E_DB}"
          (
            cd ../backend
            DATABASE_URL="sqlite:///${E2E_DB}" \
              uvicorn app.main:app --host 127.0.0.1 --port 8000 \
              > /tmp/ontologybuild-evolution-backend.log 2>&1
          ) &
          BACKEND_PID=$!
          trap 'kill "${BACKEND_PID}" 2>/dev/null || true; rm -f "${E2E_DB}"' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null; then
              break
            fi
            if ! kill -0 "${BACKEND_PID}" 2>/dev/null; then
              cat /tmp/ontologybuild-evolution-backend.log
              exit 1
            fi
            if [ "${attempt}" -eq 90 ]; then
              cat /tmp/ontologybuild-evolution-backend.log
              exit 1
            fi
            sleep 1
          done
          if ! npx playwright test src/test/e2e/ontology_evolution.spec.ts --project=chromium; then
            cat /tmp/ontologybuild-evolution-backend.log
            exit 1
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          if [ -n "${DEPLOY_HOST}" ]; then echo "DEPLOY_HOST configured: yes"; else echo "DEPLOY_HOST configured: no"; fi
          if [ -n "${DEPLOY_USER}" ]; then echo "DEPLOY_USER configured: yes"; else echo "DEPLOY_USER configured: no"; fi
          if [ -n "${DEPLOY_PASSWORD}" ]; then echo "DEPLOY_PASSWORD configured: yes"; else echo "DEPLOY_PASSWORD configured: no"; fi

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source to server
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/ontologybuild}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          tar --exclude='.git' --exclude='node_modules' --exclude='frontend/node_modules' --exclude='backend/.venv' -czf /tmp/ontologybuild.tar.gz .
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "if [ -f '${APP_DIR}/.env' ]; then cp '${APP_DIR}/.env' /tmp/ontologybuild.env; fi; rm -rf '${APP_DIR}' && mkdir -p '${APP_DIR}'"
          sshpass -p "${DEPLOY_PASSWORD}" scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 /tmp/ontologybuild.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/ontologybuild.tar.gz"
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "tar -xzf /tmp/ontologybuild.tar.gz -C '${APP_DIR}' && if [ -f /tmp/ontologybuild.env ]; then mv /tmp/ontologybuild.env '${APP_DIR}/.env' && chmod 600 '${APP_DIR}/.env'; fi; rm -f /tmp/ontologybuild.tar.gz"

      - name: Deploy over SSH
        timeout-minutes: 25
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/ontologybuild}"
          HEALTH_URL="${DEPLOY_HEALTH_URL:-http://${DEPLOY_HOST}/}"
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${APP_DIR}' && APP_DIR='${APP_DIR}' SKIP_GIT=1 HEALTH_URL='${HEALTH_URL}' bash scripts/deploy-prod.sh"
