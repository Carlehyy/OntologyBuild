name: Deploy nano-ontoprompt
on:
  push:
    branches: [nano-ontoprompt]
  workflow_dispatch:
    inputs:
      bootstrap_production_env:
        description: 'Confirm this is a fresh install with no persistent platform data'
        required: true
        default: false
        type: boolean
concurrency:
  group: deploy-nano-ontoprompt
  # A deployment may include a contract/drop migration. Queue a later push so
  # it cannot interrupt the remote host between migration and readiness.
  cancel-in-progress: false
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    # 首次安装 Python/Node 依赖 + 完整后端回归 + 迁移检查 + 前端生产构建
    # 在冷缓存 runner 上可能超过 25 分钟；保留明确上限，避免误取消正常验证。
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ontologybuild_ci
          POSTGRES_USER: ontologybuild_ci
          POSTGRES_PASSWORD: ontologybuild_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontologybuild_ci -d ontologybuild_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'ontologybuild/deploy',
              description: 'Verification and deployment are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })

      - uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            config/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --group dev
        working-directory: backend

      - name: Backend regression suite
        run: uv run pytest -q --disable-warnings --ignore tests/v2/perf
        working-directory: backend

      - name: Backend performance suite (informational)
        continue-on-error: true
        run: uv run pytest -q --disable-warnings tests/v2/perf
        working-directory: backend

      - name: Fresh database migration
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://ontologybuild_ci:ontologybuild_ci@127.0.0.1:5432/ontologybuild_ci
        run: |
          uv run alembic upgrade head
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1
          uv run alembic downgrade 0054_fact_lineage_indexes
          uv run alembic upgrade head
        working-directory: backend

      - name: Persisted ciphertext secret-split E2E
        env:
          ONTOLOGYBUILD_RUNTIME_SECRET_E2E: "1"
          ENVIRONMENT: test
          DATABASE_URL: postgresql://ontologybuild_ci:ontologybuild_ci@127.0.0.1:5432/ontologybuild_ci
        run: |
          mkdir -p ../.artifacts/runtime-secret-migration
          uv run python scripts/runtime_secret_split_postgres_e2e.py --self-test
          uv run python scripts/runtime_secret_split_postgres_e2e.py \
            --report ../.artifacts/runtime-secret-migration/report.json
        working-directory: backend

      - name: Upload runtime-secret migration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-secret-migration-${{ github.run_id }}
          path: .artifacts/runtime-secret-migration/report.json
          if-no-files-found: error
          retention-days: 14

      - name: Install configuration-center dependencies
        run: uv sync --frozen --group dev
        working-directory: config

      - name: Configuration-center regression suite
        run: uv run pytest -q
        working-directory: config

      - name: Production dependency configuration gate
        run: |
          test -s production.dependencies.env
          trap 'rm -f .env' EXIT
          APP_DIR="${GITHUB_WORKSPACE}" \
            SKIP_GIT=1 \
            BOOTSTRAP_PRODUCTION_ENV=1 \
            DEPLOY_VALIDATE_ONLY=1 \
            HEALTH_URL=http://127.0.0.1/ \
            bash scripts/deploy-prod.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate documentation and repository hygiene
        run: |
          node scripts/ci/check-markdown-links.mjs --self-test
          node scripts/ci/check-markdown-links.mjs
          bash scripts/ci/test-deploy-guards.sh
          bash scripts/ci/check-repository-hygiene.sh

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend unit tests
        run: npm run test:unit
        working-directory: frontend

      - name: Frontend E2E classification gate
        run: npm run test:e2e:classification
        working-directory: frontend

      - name: Frontend feature-boundary gate
        run: npm run check:feature-boundaries
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend production build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Frontend offline E2E suite
        run: npm run test:e2e:mocked
        working-directory: frontend

      - name: Upload frontend test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-${{ github.run_id }}
          path: .artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.prod.yml build

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/ontologybuild}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HOST}" ]; then echo "DEPLOY_HOST configured: yes"; else echo "DEPLOY_HOST configured: no"; fi
          if [ -n "${DEPLOY_USER}" ]; then echo "DEPLOY_USER configured: yes"; else echo "DEPLOY_USER configured: no"; fi
          if [ -n "${DEPLOY_PASSWORD}" ]; then echo "DEPLOY_PASSWORD configured: yes"; else echo "DEPLOY_PASSWORD configured: no"; fi
          echo "DEPLOY_APP_DIR validated: yes"

      - name: Trust deployment host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload source to server
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/ontologybuild}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          bash scripts/ci/create-deployment-archive.sh /tmp/ontologybuild.tar.gz
          REMOTE_ARCHIVE="/tmp/ontologybuild.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tar.gz"
          sshpass -p "${DEPLOY_PASSWORD}" scp -o StrictHostKeyChecking=yes -o ConnectTimeout=20 /tmp/ontologybuild.tar.gz "${DEPLOY_USER}@${DEPLOY_HOST}:${REMOTE_ARCHIVE}"
          # Keep the persistent .env in place throughout source replacement.
          # An interrupted upload can remove code, but can never strand or
          # restore a stale copy of the encryption authority from /tmp.
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${APP_DIR}' '${REMOTE_ARCHIVE}'" <<'REMOTE_SOURCE_SWAP'
          set -Eeuo pipefail
          APP_DIR="$1"
          REMOTE_ARCHIVE="$2"
          umask 077
          trap 'rm -f "$REMOTE_ARCHIVE"' EXIT
          chmod 600 "$REMOTE_ARCHIVE"
          tar -tzf "$REMOTE_ARCHIVE" >/dev/null
          if [ -L "$APP_DIR" ]; then
            echo "DEPLOY_APP_DIR must be a real directory, not a symlink"
            exit 1
          fi
          if [ -L "$APP_DIR/.env" ]; then
            echo "production .env must be a regular file, not a symlink"
            exit 1
          fi
          mkdir -p "$APP_DIR"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf -- {} +
          tar --extract --gzip --file "$REMOTE_ARCHIVE" \
            --directory "$APP_DIR" --no-same-permissions --no-same-owner
          test -f "$APP_DIR/production.dependencies.env"
          chmod 600 "$APP_DIR/production.dependencies.env"
          if [ -f "$APP_DIR/.env" ] && [ ! -L "$APP_DIR/.env" ]; then
            chmod 600 "$APP_DIR/.env"
          fi
          REMOTE_SOURCE_SWAP

      - name: Deploy over SSH
        timeout-minutes: 25
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          BOOTSTRAP_PRODUCTION_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_production_env && '1' || '0' }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_PASSWORD:?DEPLOY_PASSWORD secret is required}"
          APP_DIR="${DEPLOY_APP_DIR:-/opt/ontologybuild}"
          bash "${GITHUB_WORKSPACE}/scripts/ci/validate-deploy-app-dir.sh" "${APP_DIR}"
          if [ -n "${DEPLOY_HEALTH_URL}" ]; then
            HEALTH_URL="${DEPLOY_HEALTH_URL}"
          else
            PUBLIC_PORT="$(
              awk -F= '$1 == "PUBLIC_PORT" {
                value = substr($0, index($0, "=") + 1)
              } END {
                sub(/\r$/, "", value)
                print value
              }' production.dependencies.env
            )"
            PUBLIC_PORT="${PUBLIC_PORT:-80}"
            case "${PUBLIC_PORT}" in
              *[!0-9]*)
                echo "PUBLIC_PORT must be an integer between 1 and 65535"
                exit 1
                ;;
            esac
            if [ "${PUBLIC_PORT}" -lt 1 ] || [ "${PUBLIC_PORT}" -gt 65535 ]; then
              echo "PUBLIC_PORT must be an integer between 1 and 65535"
              exit 1
            fi
            if [ "${PUBLIC_PORT}" -eq 80 ]; then
              HEALTH_URL="http://${DEPLOY_HOST}/"
            else
              HEALTH_URL="http://${DEPLOY_HOST}:${PUBLIC_PORT}/"
            fi
          fi
          case "${HEALTH_URL}" in
            http://*|https://*) ;;
            *)
              echo "DEPLOY_HEALTH_URL must use an HTTP(S) URL"
              exit 1
              ;;
          esac
          if [[ "${HEALTH_URL}" == *"'"* || "${HEALTH_URL}" =~ [[:space:]] ]]; then
            echo "DEPLOY_HEALTH_URL must not contain quotes or whitespace"
            exit 1
          fi
          sshpass -p "${DEPLOY_PASSWORD}" ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${DEPLOY_USER}@${DEPLOY_HOST}" "cd '${APP_DIR}' && APP_DIR='${APP_DIR}' SKIP_GIT=1 BOOTSTRAP_PRODUCTION_ENV='${BOOTSTRAP_PRODUCTION_ENV}' HEALTH_URL='${HEALTH_URL}' bash scripts/deploy-prod.sh"

      - name: Remove runner deployment archive
        if: ${{ always() }}
        run: rm -f /tmp/ontologybuild.tar.gz

  report:
    if: ${{ always() }}
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment result
        uses: actions/github-script@v7
        with:
          script: |
            const verify = '${{ needs.verify.result }}'
            const deploy = '${{ needs.deploy.result }}'
            const succeeded = verify === 'success' && deploy === 'success'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'ontologybuild/deploy',
              description: succeeded
                ? 'Verification and deployment succeeded'
                : `verify=${verify}, deploy=${deploy}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
            if (!succeeded) {
              core.setFailed(`verify=${verify}, deploy=${deploy}`)
            }
