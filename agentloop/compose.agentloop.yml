# AgentLoop（阿里云 AgentLoop 观测）backend 覆盖文件。
#
# 与 docker-compose.prod.yml 叠加使用：只替换 backend 服务的镜像构建、启动命令
# 和探针环境变量，其余服务与配置全部沿用原文件。
#
# 启用方式：deploy/deploy-prod.sh 检测到服务器 .env 配置了 ARMS_LICENSE_KEY 时
# 自动叠加本文件（无需改 CI）；也可手动叠加：
#   docker compose -f docker-compose.prod.yml -f agentloop/compose.agentloop.yml ...
services:
  backend:
    image: ontologybuild-backend-agentloop:local
    build:
      # 相对路径以第一个 compose 文件（docker-compose.prod.yml，仓库根目录）为基准。
      context: .
      dockerfile: agentloop/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        ARMS_REGION_ID: ${ARMS_REGION_ID:-cn-hangzhou}
    # 与原 backend 服务的启动命令一一对应，仅包一层探针启动器。
    command: ["aliyun-instrument", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # 探针标识与凭据；ARMS_LICENSE_KEY 从服务器 .env 注入，未配置时探针不生效。
      ARMS_APP_NAME: ${ARMS_APP_NAME:-ontologybuild-backend}
      ARMS_WORKSPACE: ${ARMS_WORKSPACE:-agentloop-9d2a85cf4ad2319dcd8bbab20b3eed85}
      ARMS_REGION_ID: ${ARMS_REGION_ID:-cn-hangzhou}
      ARMS_LICENSE_KEY: ${ARMS_LICENSE_KEY:-}
