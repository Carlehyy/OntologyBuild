services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontoprompt}
      POSTGRES_USER: ${POSTGRES_USER:-ontoprompt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontoprompt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-litellm-db.sql:/docker-entrypoint-initdb.d/02-litellm-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ontoprompt} -d $${POSTGRES_DB:-ontoprompt}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ontoprompt123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chromadb:
    image: ${CHROMA_IMAGE:-chromadb/chroma:0.5.20}
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  browser:
    image: ${BROWSER_IMAGE:-chromedp/headless-shell:latest}
    command: ["--no-sandbox", "--disable-dev-shm-usage", "--remote-debugging-address=0.0.0.0", "--remote-debugging-port=9222"]
    shm_size: 2gb
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    # CI must be able to build/validate the immutable image without production
    # secrets.  Runtime deployment is still fail-closed: deploy-prod.sh requires
    # .env and the application rejects insecure production defaults at startup.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Empty is intentional and means same-origin only. Existing production
      # .env files therefore do not need a breaking CORS migration.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      STRICT_PRODUCTION_CONFIG: ${STRICT_PRODUCTION_CONFIG:-false}
      STORAGE_LOCAL_FALLBACK: "false"
      ALLOW_PUBLIC_REGISTRATION: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      # Service-to-service port is fixed inside the Compose network; a host-side
      # development CHROMA_PORT (often 8001) must not leak into production.
      CHROMA_PORT: "8000"
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
      API_HUB_DATA_DIR: /api-hub-data
      STEWARD_WORKSPACE_ROOT: /uploads/steward-sessions
      STEWARD_BROWSER_CDP_URL: http://browser:9222
      STEWARD_BROWSER_MAX_SESSIONS: ${STEWARD_BROWSER_MAX_SESSIONS:-8}
      STEWARD_BROWSER_MAX_SESSIONS_PER_USER: ${STEWARD_BROWSER_MAX_SESSIONS_PER_USER:-3}
      STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS: ${STEWARD_BROWSER_IDLE_TIMEOUT_SECONDS:-900}
      STEWARD_BROWSER_REAPER_INTERVAL_SECONDS: ${STEWARD_BROWSER_REAPER_INTERVAL_SECONDS:-30}
      STEWARD_PROXY_BASE_URL: http://backend:8000/api-hub/proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      browser:
        condition: service_started
    volumes:
      - uploads:/uploads
      - api_hub_data:/api-hub-data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      # Liveness must stay dependency-free.  Deep readiness is checked once by
      # deploy-prod.sh via /api/health; probing every dependency every 15s can
      # amplify a slow downstream service and previously leaked Chroma sockets.
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health/live', timeout=5); r.close()\""]
      interval: 15s
      timeout: 10s
      retries: 20
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      STRICT_PRODUCTION_CONFIG: ${STRICT_PRODUCTION_CONFIG:-false}
      STORAGE_LOCAL_FALLBACK: "false"
      ALLOW_PUBLIC_REGISTRATION: "false"
      DATABASE_URL: ${DATABASE_URL:-postgresql://ontoprompt:ontoprompt@db:5432/ontoprompt}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: "8000"
      UPLOADS_DIR: ${UPLOADS_DIR:-/uploads}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - uploads:/uploads
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app:celery_app", "inspect", "ping", "--timeout=5"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    healthcheck:
      # BusyBox resolves localhost to ::1 first, while this Nginx image listens
      # on IPv4.  Pin the probe to IPv4 so a healthy public frontend is not
      # permanently misreported as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  minio_data:
  chroma_data:
  uploads:
  api_hub_data:
