[project]
name = "openontology-local-config"
version = "0.1.0"
description = "Local configuration center for OpenOntology"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "httpx==0.27.2",
  "minio==7.2.12",
  "neo4j==5.26.0",
  "psycopg2-binary==2.9.9",
  "pydantic==2.13.4",
  "python-dotenv==1.0.1",
  "redis==5.1.1",
  "urllib3>=2.2,<3",
  "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
